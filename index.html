<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HACK BATTLE</title>
<style>
:root{--bg:#0b0f14;--panel:#111821;--tx:#cfe8d5;--dim:#6f8a78;--g:#39ff88;--r:#ff4d6d;--y:#ffd166;--bd:#22303c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3ef;--panel:#fff;--tx:#17301f;--dim:#5b7263;--g:#0a8f44;--r:#c42b4a;--y:#9a6b00;--bd:#c9d6cd}}
:root[data-theme="dark"]{--bg:#0b0f14;--panel:#111821;--tx:#cfe8d5}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:28px;letter-spacing:3px;color:var(--g)}
.sub{color:var(--dim);margin:2px 0 18px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
button,input{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--g);border-radius:6px;padding:9px 14px}
button{cursor:pointer;color:var(--g)}button:hover{background:var(--g);color:var(--bg)}
button.alt{border-color:var(--bd);color:var(--dim)}
input{width:100%;border-color:var(--bd)}input:focus{outline:2px solid var(--g)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bars{display:grid;gap:8px}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
.bar.bot>i{background:var(--r)}
.lbl{display:flex;justify-content:space-between;color:var(--dim);font-size:13px}
pre{margin:0;white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:12px}
.ok{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid var(--bd)}
.hide{display:none}
</style></head><body><main>
<h1>HACK//BATTLE</h1>
<p class="sub">Head-to-head breaches of a simulated machine. Fastest crack wins the round. Best of 3.</p>

<section id="menu" class="card">
 <label class="lbl" for="nm">Handle</label>
 <input id="nm" maxlength="14" placeholder="your_handle" autocomplete="off">
 <p class="lbl" style="margin-top:14px">Pick your rival</p>
 <div class="row">
  <button data-d="easy">Script Kiddie</button>
  <button data-d="med">Black Hat</button>
  <button data-d="hard">Zero Day</button>
 </div>
</section>

<section id="game" class="card hide">
 <div class="bars">
  <div><div class="lbl"><span id="pn">YOU</span><span id="ps">0</span></div><div class="bar"><i id="pb"></i></div></div>
  <div><div class="lbl"><span id="bn">RIVAL</span><span id="bs">0</span></div><div class="bar bot"><i id="bb"></i></div></div>
 </div>
 <p class="lbl" style="margin-top:14px"><span id="rd"></span><span id="tm"></span></p>
 <pre id="term"></pre>
 <div class="row" style="margin-top:12px">
  <input id="ans" placeholder="enter decrypted value" autocomplete="off" style="flex:1;min-width:180px">
  <button id="go">Execute</button>
  <button id="hint" class="alt">Hint (-25)</button>
 </div>
 <p id="msg" class="warn" style="min-height:1.5em;margin:10px 0 0"></p>
</section>

<section id="end" class="card hide">
 <h2 id="verdict" style="margin:0 0 6px"></h2>
 <p id="sum"></p>
 <button id="again">Rematch</button>
</section>

<section class="card">
 <div class="lbl" style="margin-bottom:6px"><span>LEADERBOARD</span><span>this browser</span></div>
 <table id="lb"></table>
</section>

<script>
const $=id=>document.getElementById(id);
const WORDS=["firewall","payload","gateway","kernel","cipher","backdoor","proxy","socket","root","packet","daemon","token"];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[R(0,a.length-1)];
const CFG={easy:{n:"Script Kiddie",t:[26,38]},med:{n:"Black Hat",t:[16,24]},hard:{n:"Zero Day",t:[9,15]}};
const MAX=45;
const gens={
 caesar(){const w=pick(WORDS),s=R(1,9);const enc=[...w].map(c=>String.fromCharCode((c.charCodeAt(0)-97+s)%26+97)).join("");
  return{t:"Intercepted auth token, rotated forward by "+s+" letters:\n\n  > "+enc+"\n\nDecrypt the access word.",a:w,h:"Shift each letter back by "+s+". First letter: "+w[0]};},
 hex(){const w=pick(WORDS);const hx=[...w].map(c=>c.charCodeAt(0).toString(16)).join(" ");
  return{t:"Memory dump shows a hex string:\n\n  > "+hx+"\n\nDecode it to ASCII text.",a:w,h:"61=a, 62=b ... Starts with: "+w[0]};},
 binary(){const n=R(20,250);return{t:"Door lock reads a binary code:\n\n  > "+n.toString(2).padStart(8,"0")+"\n\nEnter its decimal value.",a:String(n),h:"Bit weights: 128 64 32 16 8 4 2 1. Number has "+String(n).length+" digits."};},
 logs(){const ips=[];for(let i=0;i<3;i++)ips.push("10.0."+R(1,9)+"."+R(10,99));const top=ips[0];
  const lines=[];for(let i=0;i<5;i++)lines.push(top);lines.push(ips[1],ips[1],ips[2]);
  lines.sort(()=>Math.random()-.5);
  return{t:"Auth log, failed logins:\n\n"+lines.map((ip,i)=>"  "+String(i+1).padStart(2,"0")+" FAIL from "+ip).join("\n")+"\n\nWhich IP is brute-forcing us (most failures)?",a:top,h:"It starts with "+top.slice(0,top.lastIndexOf(".")+1)};}
};
let S;
function lb(){let l=[];try{l=JSON.parse(localStorage.getItem("hb_lb")||"[]")}catch(e){}return l}
function saveLb(n,sc){let l=lb();l.push({n,sc});l.sort((a,b)=>b.sc-a.sc);l=l.slice(0,5);try{localStorage.setItem("hb_lb",JSON.stringify(l))}catch(e){}}
function drawLb(){const l=lb();const t=$("lb");t.textContent="";if(!l.length){t.innerHTML='<tr><td class="lbl">No runs yet. Be the first.</td></tr>';return}
 l.forEach((r,i)=>{const tr=document.createElement("tr");[i+1+".",r.n,r.sc].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});t.appendChild(tr)})}
function show(id){["menu","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(d){
 const name=($("nm").value.trim()||"anon").replace(/[<>]/g,"");
 S={d,name,round:0,ps:0,bs:0,pw:0,bw:0,types:Object.keys(gens).sort(()=>Math.random()-.5).slice(0,3),live:false};
 $("pn").textContent=name.toUpperCase();$("bn").textContent=CFG[d].n.toUpperCase();
 show("game");next();
}
function next(){
 const p=gens[S.types[S.round]]();S.p=p;S.t0=Date.now();S.hint=false;S.live=true;
 S.bt=R(...CFG[S.d].t);
 $("rd").textContent="ROUND "+(S.round+1)+"/3";$("term").textContent="$ breach --target vault-"+R(100,999)+"\n\n"+p.t;
 $("ans").value="";$("msg").textContent="";$("msg").className="warn";$("ans").focus();
 clearInterval(S.iv);S.iv=setInterval(tick,250);tick();
}
function tick(){
 const el=(Date.now()-S.t0)/1000;
 $("tm").textContent=Math.max(0,MAX-Math.floor(el))+"s";
 $("pb").style.width=Math.min(100,el/MAX*100*0+((S.round)*33.3+0))+"%";
 $("bb").style.width=Math.min(100,S.round*33.3+(el/S.bt)*33.3)+"%";
 if(el>=S.bt)finish("bot",el);else if(el>=MAX)finish("none",el);
}
function norm(s){return s.trim().toLowerCase()}
function submit(){
 if(!S||!S.live)return;
 if(norm($("ans").value)===norm(S.p.a))finish("player",(Date.now()-S.t0)/1000);
 else{$("msg").className="bad";$("msg").textContent="ACCESS DENIED. Try again.";}
}
function finish(w,el){
 if(!S.live)return;S.live=false;clearInterval(S.iv);
 let m;
 if(w==="player"){const pts=Math.max(40,100+Math.round((MAX-el)*2)-(S.hint?25:0));S.ps+=pts;S.pw++;m="ACCESS GRANTED +"+pts+" pts";$("msg").className="ok"}
 else if(w==="bot"){S.bs+=100;S.bw++;m=CFG[S.d].n+" cracked it first. Answer: "+S.p.a;$("msg").className="bad"}
 else{m="Timed out. Answer: "+S.p.a;$("msg").className="warn"}
 $("msg").textContent=m;$("ps").textContent=S.ps;$("bs").textContent=S.bs;
 $("pb").style.width=(S.round+1)*33.3+"%";
 S.round++;
 const over=S.round>=3||S.pw===2||S.bw===2;
 setTimeout(()=>over?endGame():next(),2200);
}
function endGame(){
 const win=S.pw>S.bw;const tie=S.pw===S.bw;
 $("verdict").textContent=tie?"STALEMATE":win?"SYSTEM OWNED. YOU WIN":"TRACED. YOU LOSE";
 $("verdict").className=tie?"warn":win?"ok":"bad";
 const total=S.ps+(win?150:0);
 $("sum").textContent="Rounds "+S.pw+"-"+S.bw+" vs "+CFG[S.d].n+". Final score: "+total+(win?" (includes 150 win bonus)":"");
 saveLb(S.name+" ("+CFG[S.d].n+")",total);drawLb();show("end");
}
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>start(b.dataset.d));
$("go").onclick=submit;$("ans").onkeydown=e=>{if(e.key==="Enter")submit()};
$("hint").onclick=()=>{if(S&&S.live&&!S.hint){S.hint=true;$("msg").className="warn";$("msg").textContent="HINT: "+S.p.h}};
$("again").onclick=()=>show("menu");
drawLb();
</script></main></body></html>
